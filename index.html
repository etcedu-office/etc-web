<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบผู้ดูแล · สาขาวิชาเทคโนโลยีและสื่อสารการศึกษา</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%238E2130'/%3E%3Ctext x='32' y='40' font-family='Arial' font-size='17' font-weight='bold' fill='%23F5F0E4' text-anchor='middle'%3ETEC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="admin">

<!-- หน้าล็อกอิน -->
<div class="auth" id="authView">
  <div class="auth__panel">
    <div class="brand">
      <span class="brand__mark">ETC</span>
      <div>
        <strong>ระบบจัดการเว็บไซต์</strong>
        <span>สาขาวิชาฯ คณะศึกษาศาสตร์ ม.มหาสารคาม</span>
      </div>
    </div>
    <h1>เข้าสู่ระบบผู้ดูแล</h1>
    <p class="auth__lead">จัดการการ์ด Infographic ผู้ใช้ และตั้งค่าหน้าเว็บไซต์</p>
    <form id="loginForm">
      <label>อีเมล<input type="email" id="loginEmail" required autocomplete="username"></label>
      <label>รหัสผ่าน<input type="password" id="loginPass" required autocomplete="current-password"></label>
      <p class="form-err" id="loginErr" hidden></p>
      <button class="btn btn--primary btn--block" id="loginBtn" type="submit">
        เข้าสู่ระบบ <i data-lucide="log-in"></i>
      </button>
    </form>
    <p class="auth__demo" id="authDemo" hidden>
      โหมดตัวอย่าง — ลอง: <code>admin@msu.ac.th</code> / <code>etc1234</code>
    </p>
    <a href="index.html" class="auth__back">← กลับหน้าเว็บไซต์</a>
  </div>
</div>

<!-- โครงหลังบ้าน -->
<div class="shell" id="appView" hidden>
  <aside class="side">
    <div class="brand side__brand">
      <span class="brand__mark">ETC</span>
      <div><strong>ระบบจัดการเว็บ</strong></div>
    </div>
    <nav class="side__nav" id="nav"></nav>
    <div class="side__user">
      <strong id="uName"></strong>
      <span id="uRole"></span>
      <button class="btn btn--ghost btn--sm" id="logoutBtn">
        <i data-lucide="log-out"></i> ออกจากระบบ
      </button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar2">
      <h2 id="viewTitle">ภาพรวมระบบ</h2>
      <a class="btn btn--sm" href="index.html" target="_blank" rel="noopener">
        <i data-lucide="external-link"></i> ดูหน้าเว็บจริง
      </a>
    </header>
    <div class="view" id="view"></div>
  </div>
</div>

<!-- โมดัล + Toast + แถบโหมดตัวอย่าง -->
<div class="modalback" id="modalBack" hidden><div class="modal" id="modalBox"></div></div>
<div class="toasts" id="toasts"></div>
<div class="mockbar" id="mockbar" hidden>โหมดตัวอย่าง — ข้อมูลที่แก้จะหายเมื่อรีเฟรช</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
